<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=landing.html">
    <title>IA Generativa - Redirigiendo...</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #F2F5F3; font-family: 'DM Sans', sans-serif; color: #101411; }
        .loader { text-align: center; }
        .loader span { color: #0FBF3E; font-weight: 700; }
    </style>
</head>
<body>
    <div class="loader">
        <div style="width: 40px; height: 40px; border: 3px solid #E4EBE6; border-top: 3px solid #0FBF3E; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
        <p>Cargando <span>IA Generativa</span>...</p>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
</body>
</html>
