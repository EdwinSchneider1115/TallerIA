<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | IA Generativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <header class="site-header">
        <div class="header-inner">
            <a href="landing.html" class="brand">
                <svg class="brand-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    <path d="M12 22V12"/>
                </svg>
                <span>IA Generativa</span>
            </a>
            <a href="landing.html" class="btn btn-ghost btn-sm">Volver al inicio</a>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-form-card">
            <div class="auth-header">
                <div class="auth-icon-svg">🔑</div>
                <h1>Iniciar sesión</h1>
                <p>Accede a tu cuenta para continuar aprendiendo.</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group position-relative">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="form-toggle" id="toggle-password" aria-label="Mostrar contraseña">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="login-btn">Iniciar sesión</button>
            </form>

            <div class="divider"><span>o</span></div>

            <p class="auth-cta">¿No tienes cuenta? <a href="register.html">Regístrate gratis</a></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 IA Generativa - Plataforma educativa</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtxMJju-8hOMdqFhLL85TLXzTcMCY3D44",
            authDomain: "talleria-2f756.firebaseapp.com",
            projectId: "talleria-2f756",
            storageBucket: "talleria-2f756.firebasestorage.app",
            messagingSenderId: "590645983040",
            appId: "1:590645983040:web:7e6a816e5b5954de04aca5",
            measurementId: "G-8NCD93QMGR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const togglePassword = document.getElementById('toggle-password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                alert('Por favor completa todos los campos.');
                return;
            }

            loginBtn.textContent = 'Iniciando sesión...';
            loginBtn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'landing.html';
            } catch (error) {
                console.error(error);
                let message = 'Error al iniciar sesión.';
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    message = 'Correo o contraseña incorrectos.';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'Correo inválido.';
                } else if (error.code === 'auth/operation-not-allowed') {
                    message = 'Habilita Email/Password en Firebase Console.';
                }
                alert(message);
                loginBtn.textContent = 'Iniciar sesión';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
